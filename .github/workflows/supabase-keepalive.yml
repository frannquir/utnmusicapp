name: Supabase keep-alive

# El plan gratuito de Supabase pausa el proyecto tras 7 dias sin actividad.
# Este workflow hace una request a la API cada 3 dias para evitarlo.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            -H "apikey: sb_publishable_f2mGKk9El_5XfvEakwtxsw_de263xjY" \
            "https://hykkrlnoigsnmcphsdli.supabase.co/rest/v1/" -o /dev/null -w "HTTP %{http_code}\n"
